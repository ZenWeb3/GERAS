<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — GERAS</title>
    <style>
      html, body { margin: 0; background: #0b1220; color: #e7ecf5; font-family: system-ui, sans-serif; }
      main { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      .card { max-width: 24rem; text-align: center; }
      h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
      p { color: #8b98b3; margin: 0 0 1rem; }
      a { display: inline-block; padding: .75rem 1.25rem; border-radius: .75rem; background: #ff3b3b; color: white; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>You are offline</h1>
        <p>The reporter is still available — location alerts will hand off to your messaging app.</p>
        <a href="/report">Open reporter</a>
      </div>
    </main>
  </body>
</html>
